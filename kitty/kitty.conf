# ~/.config/kitty/kitty.conf

# --- Font ---
font_family JetBrains Mono NL
font_size 14.0

# --- Window and opacity ---
background_opacity 0.85
background_blur 30
window_padding_width 0

# --- Env ---
env TERM=kitty


# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME
